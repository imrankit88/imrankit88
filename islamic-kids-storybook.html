<style>
/* Layout: one open-book spread at a time (picture + words), chapter tabs above, page controls fixed below */
:root{
  --paper:#EAF3EE; --card:#FFFFFF; --ink:#16313A; --muted:#536D73; --line:#D2E2DA;
  --accent:#0C7560; --on-accent:#FFFFFF; --gold:#C2851A;
  --shadow:0 14px 40px rgba(22,49,58,.12);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-ar:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C181B; --card:#13252A; --ink:#E6F0EC; --muted:#99B1AB; --line:#22393D;
  --accent:#40C4A2; --on-accent:#05281F; --gold:#F0B650; --shadow:0 14px 40px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C181B; --card:#13252A; --ink:#E6F0EC; --muted:#99B1AB; --line:#22393D;
  --accent:#40C4A2; --on-accent:#05281F; --gold:#F0B650; --shadow:0 14px 40px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px;display:grid;gap:14px}

.top{display:grid;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.brand svg{width:28px;height:28px;flex:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{flex:none;font:700 .95rem var(--f-display);color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:.8rem}
.tab[aria-current="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--card))}
.tab:focus-visible,.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.val:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.spread{display:grid;gap:22px;align-items:center;background:var(--card);border-radius:28px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.spread.tall{align-items:start}
@media (min-width:900px){.spread{grid-template-columns:1.12fr 1fr;padding:22px;gap:30px}.spread.tall .art{position:sticky;top:16px}}
.spread.turn{animation:turn .45s ease}
@keyframes turn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.art{margin:0;border-radius:20px;overflow:hidden;aspect-ratio:8/5;max-width:100%;background:var(--line);position:relative}
.art svg{display:block;width:100%;height:100%}
.text{min-width:0;padding:2px 6px 8px;display:grid;gap:14px;align-content:start}
.eyebrow{font:800 .8rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--ch) 72%,var(--ink));display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0}
.pbuh{font-family:var(--f-ar);font-size:1rem;letter-spacing:0;text-transform:none;font-weight:400;background:color-mix(in srgb,var(--ch) 14%,var(--card));padding:0 10px;border-radius:999px}
h1,h2{font-family:var(--f-display);line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,5.4vw,3.6rem)}
h2{font-size:clamp(1.8rem,3.6vw,2.6rem)}
.text p{font-size:1.17rem;line-height:1.7;margin:0;max-width:60ch}
.sub{font:700 1.3rem var(--f-display);color:var(--muted)}
.ayah{border-radius:16px;padding:12px 18px;background:color-mix(in srgb,var(--gold) 11%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 38%,transparent);display:grid;gap:4px}
.ayah .ar{font-family:var(--f-ar);font-size:1.65rem;direction:rtl;text-align:right;line-height:1.9}
.ayah .en{font-style:italic;font-size:1.08rem;line-height:1.55}
.ayah .ref{font-size:.85rem;color:var(--muted);font-weight:700}
.lesson{background:color-mix(in srgb,var(--ch) 13%,var(--card));border-radius:16px;padding:14px 18px;display:grid;gap:6px}
.label{font:800 .78rem var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:color-mix(in srgb,var(--ch) 72%,var(--ink))}
.lesson p{font-size:1.1rem}
.talk{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:1.02rem;line-height:1.55}
.talk svg{flex:none;width:24px;height:24px;margin-top:2px}
.talk b{color:var(--ink)}

.btn{font:800 1rem var(--f-display);border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:48px;padding:6px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.4;cursor:default}
.btn svg{width:20px;height:20px}

.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chip{display:grid;gap:2px;text-align:left;padding:10px 14px;border-radius:16px;border:2px solid color-mix(in srgb,var(--c) 40%,var(--line));background:color-mix(in srgb,var(--c) 9%,var(--card));color:var(--ink);cursor:pointer;font-family:var(--f-body)}
.chip b{font:800 1.1rem var(--f-display)}
.chip span{font-size:.9rem;color:var(--muted)}
.chip .ar{font-family:var(--f-ar);font-size:1.1rem;color:var(--ink)}

.quiz{display:grid;gap:14px}
.q{display:grid;gap:8px;padding:12px 14px;border-radius:16px;border:1px solid var(--line)}
.q h3{margin:0;font:800 1.08rem var(--f-display)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:700 1rem var(--f-body);border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer;min-height:44px}
.opt.right{border-color:#2E9D62;background:color-mix(in srgb,#2E9D62 18%,var(--card))}
.opt.wrong{border-color:#D0533F;background:color-mix(in srgb,#D0533F 14%,var(--card))}
.fb{font-size:.95rem;color:var(--muted);min-height:1.2em;margin:0}
.score{font:800 1.2rem var(--f-display);color:var(--accent)}

.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.val{display:grid;gap:4px;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid color-mix(in srgb,var(--c) 40%,var(--line));background:var(--card);color:var(--ink);cursor:pointer;font-family:var(--f-body)}
.val .who{font:800 .78rem var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 72%,var(--ink))}
.val b{font:800 1.08rem var(--f-display);line-height:1.2}
.val .st{width:26px;height:26px}
.val .st path{fill:none;stroke:var(--line);stroke-width:2}
.val[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 13%,var(--card))}
.val[aria-pressed="true"] .st path{fill:#F2B632;stroke:#C98A12}

.controls{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.controls .in{max-width:1140px;margin:0 auto;display:flex;gap:10px;align-items:center}
.prog{flex:1;min-width:0;display:grid;gap:4px}
.track{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.plabel{font-size:.85rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.btn .t{display:none}.btn{padding:6px 14px}}

/* illustration motion */
.tw{animation:tw 3s ease-in-out infinite alternate}
.tw:nth-child(3n){animation-delay:-1.5s}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.fall{animation:fall .6s linear infinite}
@keyframes fall{from{transform:translate(0,-36px)}to{transform:translate(-12px,0)}}
.bob{animation:bob 4s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,.95)}to{transform:scale(1.02,1.05)}}
.gust{animation:gust 2.2s ease-in-out infinite alternate}
@keyframes gust{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@media (prefers-reduced-motion:reduce){.tw,.fall,.bob,.flick,.gust,.spread.turn{animation:none}.fill{transition:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FC2EC"/><stop offset="1" stop-color="#DDF3FB"/></linearGradient>
    <linearGradient id="g-dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A3270"/><stop offset=".55" stop-color="#8E5B8F"/><stop offset="1" stop-color="#F4A86B"/></linearGradient>
    <linearGradient id="g-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#091236"/><stop offset="1" stop-color="#22407A"/></linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#FFF5DA"/></linearGradient>
    <linearGradient id="g-storm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#36404F"/><stop offset="1" stop-color="#7E8B99"/></linearGradient>
    <linearGradient id="g-desert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5A85E"/><stop offset="1" stop-color="#FDE6BA"/></linearGradient>
    <linearGradient id="g-jannah" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B5E8D2"/><stop offset="1" stop-color="#FFF4D2"/></linearGradient>
    <linearGradient id="g-dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ECBEE"/><stop offset="1" stop-color="#FFD7A3"/></linearGradient>
    <linearGradient id="g-hope" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2B66"/><stop offset=".6" stop-color="#6B67A8"/><stop offset="1" stop-color="#F6B887"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="warm"><stop offset="0" stop-color="#FFD27A" stop-opacity=".75"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></radialGradient>
    <radialGradient id="sunGlow"><stop offset="0" stop-color="#FFE38A" stop-opacity=".85"/><stop offset="1" stop-color="#FFE38A" stop-opacity="0"/></radialGradient>
  </defs>
</svg>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="-20 -20 40 40" aria-hidden="true"><rect x="-12" y="-12" width="24" height="24" fill="#0C7560"/><rect x="-12" y="-12" width="24" height="24" fill="#E9A23B" transform="rotate(45)"/><circle r="6" fill="#FFF6D6"/></svg>
      Stories of the Prophets
    </div>
    <nav class="tabs" id="tabs" aria-label="Chapters"></nav>
  </header>
  <main>
    <article class="spread" id="spread" aria-live="polite"></article>

<div class="controls">
  <div class="in">
    <button class="btn" id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="t">Back</span></button>
    <div class="prog"><div class="track"><div class="fill" id="fill"></div></div><div class="plabel" id="plabel"></div></div>
    <button class="btn" id="read" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="t" id="readt">Read to me</span></button>
    <button class="btn primary" id="next" aria-label="Next page"><span class="t">Next</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<script>
/* ---------- illustration toolkit (no people are ever drawn) ---------- */
let uid = 0;
const R = seed => { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const f = n => n.toFixed(1);
const sky = g => `<rect width="800" height="500" fill="url(#${g})"/>`;
const ground = (y, c) => `<rect x="0" y="${y}" width="800" height="${500 - y}" fill="${c}"/>`;
function stars(n, seed, maxY = 320, col = '#FFF4CC') {
  const r = R(seed); let s = '';
  for (let i = 0; i < n; i++) { const x = r() * 800, y = r() * maxY, rad = .6 + r() * 1.8, tw = r() > .65;
    s += `<circle${tw ? ' class="tw"' : ''} cx="${f(x)}" cy="${f(y)}" r="${f(rad)}" fill="${col}" opacity="${(.5 + r() * .5).toFixed(2)}"/>`; }
  return s;
}
function moon(x, y, r, col = '#FFF1B8') {
  const id = 'mk' + (uid++);
  return `<circle cx="${x}" cy="${y}" r="${r * 2.4}" fill="url(#glow)" opacity=".28"/><mask id="${id}"><rect width="800" height="500" fill="#fff"/><circle cx="${x + r * .42}" cy="${y - r * .22}" r="${r * .86}" fill="#000"/></mask><circle cx="${x}" cy="${y}" r="${r}" fill="${col}" mask="url(#${id})"/>`;
}
const sun = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r * 3.2}" fill="url(#sunGlow)"/><circle cx="${x}" cy="${y}" r="${r}" fill="#FFD65A"/>`;
function rays(x, y, n, len, col, op) {
  let s = `<g fill="${col}" opacity="${op}">`;
  for (let i = 0; i < n; i++) { const a = i * Math.PI * 2 / n, w = .055;
    s += `<polygon points="${x},${y} ${f(x + Math.cos(a - w) * len)},${f(y + Math.sin(a - w) * len)} ${f(x + Math.cos(a + w) * len)},${f(y + Math.sin(a + w) * len)}"/>`; }
  return s + '</g>';
}
function hills(seed, base, amp, col, step = 100) {
  const r = R(seed), p = [];
  for (let x = -100; x <= 900; x += step) p.push([x, base - r() * amp]);
  let d = `M-100,520 L${p[0][0]},${f(p[0][1])}`;
  for (let i = 1; i < p.length; i++) { const mx = (p[i - 1][0] + p[i][0]) / 2, my = (p[i - 1][1] + p[i][1]) / 2; d += ` Q${p[i - 1][0]},${f(p[i - 1][1])} ${mx},${f(my)}`; }
  const l = p[p.length - 1]; d += ` L${l[0]},${f(l[1])} L900,520Z`;
  return `<path d="${d}" fill="${col}"/>`;
}
function tree(x, y, s = 1, c = '#4FAE6E', c2 = '#3A8F57', fruit) {
  let fr = '';
  if (fruit) { const fc = fruit === 'gold' ? '#FFC83D' : '#E8505B';
    [[-20, -70], [18, -78], [0, -102], [-8, -60], [26, -60], [-30, -92], [30, -96]].forEach(([a, b]) => fr += `<circle cx="${a}" cy="${b}" r="5.5" fill="${fc}"/>`); }
  return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-6" y="-62" width="12" height="62" rx="4" fill="#7A4E2D"/><circle cx="0" cy="-82" r="36" fill="${c2}"/><circle cx="-24" cy="-68" r="25" fill="${c}"/><circle cx="22" cy="-72" r="27" fill="${c}"/><circle cx="0" cy="-100" r="25" fill="${c}"/>${fr}</g>`;
}
function palm(x, y, s = 1, dark) {
  const t = dark ? '#191433' : '#8A5A32', l1 = dark ? '#191433' : '#3B8C4E', l2 = dark ? '#191433' : '#2F7A40';
  return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0,0 Q-8,-55 6,-112" stroke="${t}" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M6,-110 Q-25,-132 -60,-98 Q-28,-114 6,-106Z" fill="${l2}"/><path d="M6,-110 Q40,-134 72,-96 Q38,-114 6,-106Z" fill="${l2}"/>
  <path d="M6,-110 Q-10,-152 -42,-150 Q-14,-138 6,-108Z" fill="${l1}"/><path d="M6,-110 Q24,-154 56,-146 Q28,-136 6,-108Z" fill="${l1}"/>
  <path d="M6,-110 Q-22,-110 -42,-70 Q-18,-100 6,-106Z" fill="${l1}"/><path d="M6,-110 Q34,-110 52,-72 Q30,-100 6,-106Z" fill="${l1}"/>
  ${dark ? '' : '<circle cx="2" cy="-102" r="5" fill="#8B4A1E"/><circle cx="10" cy="-100" r="5" fill="#8B4A1E"/><circle cx="6" cy="-94" r="5" fill="#8B4A1E"/>'}</g>`;
}
function flowers(seed, n, y1, y2, x1 = 0, x2 = 800) {
  const r = R(seed), cols = ['#FF8FAB', '#FFD166', '#FFFFFF', '#C77DFF', '#FF9F5A']; let s = '';
  for (let i = 0; i < n; i++) { const x = x1 + r() * (x2 - x1), y = y1 + r() * (y2 - y1), c = cols[Math.floor(r() * cols.length)], k = .7 + r() * .6;
    s += `<g transform="translate(${f(x)} ${f(y)}) scale(${k.toFixed(2)})" fill="${c}"><circle cx="0" cy="-4.5" r="3.6"/><circle cx="4.3" cy="-1.4" r="3.6"/><circle cx="2.7" cy="3.7" r="3.6"/><circle cx="-2.7" cy="3.7" r="3.6"/><circle cx="-4.3" cy="-1.4" r="3.6"/><circle r="2.4" fill="#F4A100"/></g>`; }
  return s;
}
const cloud = (x, y, s, col = '#fff', op = 1) => `<g transform="translate(${x} ${y}) scale(${s})" fill="${col}" opacity="${op}"><ellipse cx="0" cy="0" rx="64" ry="22"/><circle cx="-26" cy="-12" r="25"/><circle cx="10" cy="-24" r="31"/><circle cx="40" cy="-8" r="21"/></g>`;
function rain(seed, n, col = '#C9E6FF') {
  const r = R(seed); let s = `<g stroke="${col}" stroke-width="2" stroke-linecap="round" opacity=".7">`;
  for (let i = 0; i < n; i++) { const x = r() * 840, y = r() * 540 - 40; s += `<line x1="${f(x)}" y1="${f(y)}" x2="${f(x - 6)}" y2="${f(y + 18)}"/>`; }
  return s + '</g>';
}
function waves(y, col, amp, shift = 0) {
  let d = `M${-80 + shift},540 L${-80 + shift},${y}`;
  for (let x = -80 + shift; x < 880; x += 60) d += ` Q${x + 15},${y - amp} ${x + 30},${y} Q${x + 45},${y + amp * .5} ${x + 60},${y}`;
  return `<path class="bob" d="${d} L880,540Z" fill="${col}"/>`;
}
function ark(x, y, s, partial) {
  let body;
  if (partial) {
    let ribs = '';
    for (let i = -150; i <= 150; i += 30) ribs += `<path d="M${i},-10 Q${f(i * .96)},36 ${f(i * .72)},62" stroke="#8B5A2B" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    body = `${ribs}<path d="M-118,62 L118,62" stroke="#6E4420" stroke-width="10" stroke-linecap="round"/><path d="M-115,62 L30,62 L30,30 L-152,30 Q-142,52 -115,62Z" fill="#8B5A2B"/><path d="M-145,46 H30" stroke="#6E4420" stroke-width="3"/><rect x="-178" y="-16" width="160" height="10" rx="5" fill="#A06A35"/>`;
  } else {
    body = `<path d="M-170,-10 L170,-10 Q150,55 115,62 L-115,62 Q-150,55 -170,-10Z" fill="#8B5A2B"/><path d="M-162,10 H162 M-150,30 H150 M-134,48 H134" stroke="#6E4420" stroke-width="3"/><rect x="-178" y="-18" width="356" height="12" rx="5" fill="#A06A35"/>
    <rect x="-100" y="-80" width="200" height="64" fill="#B07A42"/><path d="M-116,-78 L0,-126 L116,-78Z" fill="#7A4A22"/>
    ${[-74, -32, 10, 52].map(w => `<rect x="${w}" y="-64" width="22" height="18" rx="3" fill="#FFD27A"/>`).join('')}`;
  }
  return `<g transform="translate(${x} ${y}) scale(${s})">${body}</g>`;
}
function camel(x, y, s, c = '#C98E4E', drink) {

  ['What did Adam do after his mistake?', ['Hid away', 'Said sorry to Allah', 'Blamed someone'], 1, 'Adam and Hawwa said sorry, and Allah forgave them.'],
  ['Which prophet was one of the first to write with a pen?', ['Salih', 'Ibrahim', 'Idris'], 2, 'Many scholars say Prophet Idris was one of the first.'],
  ['What did Nuh build?', ['A tower', 'An ark', 'A well'], 1, 'Nuh built a huge ark, even when people laughed.'],
  ['What did the people of ‘Ad think the dark cloud was?', ['Rain', 'Snow', 'Birds'], 0, 'It was a fierce wind, not rain.'],
  ['What came out of the rock for the people of Thamud?', ['A lion', 'A river', 'A she-camel'], 2, 'The she-camel was a sign from Allah.'],
  ['What did Allah tell the fire?', ['Burn brighter', 'Be cool and safe', 'Go away'], 1, '“O fire, be cool and safe for Ibrahim.”'],
];
const VALUES = ['adam', 'idris', 'nuh', 'hud', 'salih', 'ibrahim'];

/* ---------- rendering ---------- */
const $ = id => document.getElementById(id);
const spread = $('spread');
let idx = 0, quizAns = {}, collected = {};
try { idx = Math.min(PAGES.length - 1, Math.max(0, +localStorage.getItem('a2i-page') || 0)); } catch (e) {}
try { collected = JSON.parse(localStorage.getItem('a2i-stars') || '{}') || {}; } catch (e) {}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const TALK_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
const STAR = '<svg class="st" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" stroke-linejoin="round"/></svg>';

function firstPage(ch) { return PAGES.findIndex(p => p.ch === ch); }

function buildTabs() {
  $('tabs').innerHTML = Object.entries(CH).map(([k, c]) =>
    `<button class="tab" data-ch="${k}" style="--c:${c.color}">${c.n ? `<span class="n">${c.n}</span>${c.name}` : c.tab}</button>`).join('');
  $('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) go(firstPage(b.dataset.ch)); });
}

function ayahHTML(a) { return `<div class="ayah"><div class="ar" lang="ar">${a.ar}</div><div class="en">${a.en}</div><div class="ref">${a.ref}</div></div>`; }

function textHTML(p) {
  const c = CH[p.ch];
  if (p.cover) return `<p class="eyebrow">A picture book for ages 5 to 10</p>
    <h1>Stories of the Prophets</h1><div class="sub">From Adam to Ibrahim</div>
    <p>Six true stories from the Qur’an, with a lesson to remember and a question to talk about together after every story.</p>
    <div><button class="btn primary" data-go="1">Open the book</button></div>`;
  if (p.welcome) return `<p class="eyebrow">Before we begin</p><h2>Bismillah</h2>
    ${ayahHTML({ ar: 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ', en: '“In the name of Allah, the Most Gracious, the Most Merciful.”', ref: 'We say this before we start something good' })}
    <p>Allah sent prophets to teach people to worship Him alone and to be kind and good. These stories come from the Qur’an.</p>
    <p>Out of love and respect, we never draw the prophets. The pictures show the world around their stories instead. When you hear a prophet’s name, say <b>‘alayhis-salam</b>: peace be upon him.</p>
    <div class="label">Choose a story</div>
    <div class="chips">${VALUES.map(k => { const v = CH[k]; return `<button class="chip" data-go="${firstPage(k)}" style="--c:${v.color}"><span>Chapter ${v.n}</span><b>${v.name} <span class="ar" lang="ar">${v.ar}</span></b><span>${v.alt}</span></button>`; }).join('')}</div>`;
  if (p.quiz) return `<p class="eyebrow">Let’s remember</p><h2>Story Quiz</h2><p>Tap the answer you think is right.</p>
    <div class="quiz" id="quiz">${QUIZ.map((q, qi) => `<div class="q"><h3>${qi + 1}. ${q[0]}</h3><div class="opts">${q[1].map((o, oi) => `<button class="opt" data-q="${qi}" data-o="${oi}">${o}</button>`).join('')}</div><p class="fb" id="fb${qi}"></p></div>`).join('')}</div>
    <div class="score" id="score"></div>`;
  if (p.values) return `<p class="eyebrow">My treasure chest</p><h2>Good Manners I Learned</h2>
    <p>Tap a star when you have practised that good manner this week.</p>
    <div class="vals">${VALUES.map(k => { const v = CH[k]; return `<button class="val" data-v="${k}" aria-pressed="${!!collected[k]}" style="--c:${v.color}">${STAR}<span class="who">Prophet ${v.name}</span><b>${v.value}</b></button>`; }).join('')}</div>
    ${ayahHTML({ ar: 'رَّبِّ زِدْنِي عِلْمًا', en: '“My Lord, increase me in knowledge.”', ref: 'Surah Ta-Ha 20:114' })}
    <p>Next time: the stories of Prophet Ismail, Ishaq, Yaqub and Yusuf, peace be upon them all.</p>
    <div><button class="btn" data-go="0">Back to the cover</button></div>`;
  let body = '';
  p.body.forEach((para, i) => { body += `<p>${para}</p>`; if (p.ayah && (p.ayah.after ?? p.body.length - 1) === i) body += ayahHTML(p.ayah); });
  return `<p class="eyebrow">Chapter ${c.n} · Prophet ${c.name} <span class="pbuh" lang="ar">عليه السلام</span></p>
    <h2>${p.title}</h2>${body}
    ${p.lesson ? `<div class="lesson"><div class="label">What we learn</div><p>${p.lesson}</p></div>` : ''}
    ${p.talk ? `<div class="talk">${TALK_ICON}<span><b>Talk together:</b> ${p.talk}</span></div>` : ''}`;
}

function render(animate) {
  const p = PAGES[idx], c = CH[p.ch];
  stopReading();
  spread.style.setProperty('--ch', c.color);
  spread.classList.toggle('tall', !!(p.quiz || p.values || p.welcome));
  spread.innerHTML = `<figure class="art"><svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(p.alt)}">${SC[p.scene]()}</svg></figure><div class="text">${textHTML(p)}</div>`;
  if (animate) { spread.classList.remove('turn'); void spread.offsetWidth; spread.classList.add('turn'); }
  if (p.quiz) restoreQuiz();
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.ch === p.ch));
  const cur = document.querySelector('.tab[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  $('prev').disabled = idx === 0; $('next').disabled = idx === PAGES.length - 1;
  $('fill').style.width = ((idx + 1) / PAGES.length * 100) + '%';
  $('plabel').textContent = `Page ${idx + 1} of ${PAGES.length}` + (c.n ? ` · Prophet ${c.name}` : '');
  try { localStorage.setItem('a2i-page', idx); } catch (e) {}
}
function go(i) { if (i < 0 || i >= PAGES.length || i === idx) return; idx = i; render(true); window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }

function markQuiz(qi) {
  const q = QUIZ[qi], a = quizAns[qi];
  document.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(b => { const o = +b.dataset.o; b.classList.toggle('right', o === q[2]); b.classList.toggle('wrong', o === a && a !== q[2]); });
  $('fb' + qi).textContent = (a === q[2] ? 'Well done! ' : 'Good try! ') + q[3];
  const n = Object.keys(quizAns).length, right = Object.entries(quizAns).filter(([k, v]) => QUIZ[k][2] === v).length;
  $('score').textContent = n === QUIZ.length ? `You got ${right} out of ${QUIZ.length}. ${right === QUIZ.length ? 'MashaAllah, a perfect score!' : 'MashaAllah, keep reading and try again!'}` : '';
}
function restoreQuiz() { Object.keys(quizAns).forEach(k => markQuiz(+k)); }

spread.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(+g.dataset.go); return; }
  const o = e.target.closest('.opt'); if (o) { const qi = +o.dataset.q; if (quizAns[qi] === undefined) { quizAns[qi] = +o.dataset.o; markQuiz(qi); } return; }
  const v = e.target.closest('.val'); if (v) { const k = v.dataset.v; collected[k] = !collected[k]; v.setAttribute('aria-pressed', !!collected[k]); try { localStorage.setItem('a2i-stars', JSON.stringify(collected)); } catch (err) {} }
});
$('prev').onclick = () => go(idx - 1);
$('next').onclick = () => go(idx + 1);
document.addEventListener('keydown', e => { if (e.target.closest('input,textarea')) return; if (e.key === 'ArrowRight') go(idx + 1); if (e.key === 'ArrowLeft') go(idx - 1); });
let tx = null, ty = null;
spread.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
spread.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(idx + (dx < 0 ? 1 : -1)); tx = null; });

/* read aloud */
const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let reading = false;
function pageSpeech() {
  const p = PAGES[idx];
  if (!p.body) return spread.querySelector('.text').innerText.replace(/[؀-ۿً-ٟ]+/g, ' ');
  let s = p.title + '. '; p.body.forEach((b, i) => { s += b + ' '; if (p.ayah && (p.ayah.after ?? p.body.length - 1) === i) s += p.ayah.en + ' '; });
  if (p.lesson) s += 'What we learn. ' + p.lesson + ' '; if (p.talk) s += 'Talk together. ' + p.talk;
  return s;
}
function stopReading() { if (canSpeak && reading) { try { speechSynthesis.cancel(); } catch (e) {} } reading = false; $('readt').textContent = 'Read to me'; }
if (canSpeak) {
  $('read').hidden = false;
  $('read').onclick = () => {
    if (reading) { stopReading(); return; }
    try { const u = new SpeechSynthesisUtterance(pageSpeech()); u.rate = .9; u.pitch = 1.05; u.onend = u.onerror = () => { reading = false; $('readt').textContent = 'Read to me'; };
      speechSynthesis.speak(u); reading = true; $('readt').textContent = 'Stop'; } catch (e) { stopReading(); }
  };
}

function fromHash() { const h = location.hash.slice(1); if (CH[h]) { idx = firstPage(h); return true; } return false; }
buildTabs(); fromHash(); render(false);
window.addEventListener('hashchange', () => { if (fromHash()) render(true); });
</script>
